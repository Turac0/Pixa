[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pixa"
version = "0.5.4"
description = "A clean, modern, local PDF editor"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "PySide6-Essentials>=6.6",
    "pymupdf>=1.24.2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "pyinstaller>=6.5"]

[project.gui-scripts]
pixa = "pixa.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pixa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
